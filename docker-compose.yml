version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: complanx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: complanx
    ports:
      - "5432:5432"
    volumes:
      - complanx_pgdata:/var/lib/postgresql/data

volumes:
  complanx_pgdata:
